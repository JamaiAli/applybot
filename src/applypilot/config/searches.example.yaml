# ApplyPilot search configuration
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (applypilot init) generates a basic version automatically.

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
queries:
  - query: "software engineer"
    tier: 1
  - query: "backend engineer"
    tier: 1
  - query: "backend developer"
    tier: 1
  - query: "full stack developer"
    tier: 2
  - query: "full stack engineer"
    tier: 2
  - query: "python developer"
    tier: 2
  - query: "python engineer"
    tier: 2
  - query: "DevOps engineer"
    tier: 2
  - query: "site reliability engineer"
    tier: 2
  - query: "platform engineer"
    tier: 2
  - query: "cloud engineer"
    tier: 2
  - query: "data engineer"
    tier: 2
  - query: "infrastructure engineer"
    tier: 2
  - query: "software developer"
    tier: 3
  - query: "developer"
    tier: 3
  - query: "systems engineer"
    tier: 3
  - query: "automation engineer"
    tier: 3
  - query: "solutions engineer"
    tier: 3
  - query: "integration engineer"
    tier: 3
  - query: "ML engineer"
    tier: 3
  - query: "machine learning engineer"
    tier: 3
  - query: "AI engineer"
    tier: 3
  - query: "security engineer"
    tier: 3

# Locations to search
locations:
  - location: "San Francisco, CA"
    remote: false
  - location: "Remote"
    remote: true

# Location filtering -- accept/reject patterns for job location text
location:
  accept_patterns:
    - "San Francisco"
    - "Bay Area"
    - "SF"
    - "California"
    - "CA"
    - "Remote"
    - "Anywhere"
    - "United States"
    - "US"
    - "USA"
  reject_patterns:
    - "New York only"
    - "Seattle only"
    - "onsite only"
    - "London, UK"
    - "India"
    - "Philippines"

# Country for Indeed/LinkedIn/Google Jobs searches
country: "USA"

# JobSpy source boards (all available options shown).
# NOTE: linkedin is intentionally NOT listed — LinkedIn automation is
# disabled project-wide (ToS / ban risk) and stripped at runtime.
boards:
  - indeed
  - glassdoor
  - google

# Search defaults
defaults:
  results_per_site: 100  # Max results per board per query
  hours_old: 72          # Only jobs posted within this many hours

# Negative keywords -- skip jobs with these in the title (case-insensitive).
# NOTE: "intern"/"internship"/"co-op" retirés — on cherche justement des stages.
exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "clearance required"

# ── France Travail (API officielle « Offres d'emploi v2 ») ──────────────────
# Identifiants à créer sur https://francetravail.io puis à placer dans
# ~/.applypilot/.env : FRANCE_TRAVAIL_CLIENT_ID / FRANCE_TRAVAIL_CLIENT_SECRET.
france_travail:
  queries:
    - "stage cybersécurité"
    - "stage administrateur systèmes et réseaux"
    - "stage intégration IT"
    - "stage Active Directory"
  type_contrat: ""        # code contrat côté serveur (optionnel ; voir filtresPossibles)
  departement: ""         # ex. "18" (Cher) — optionnel
  region: ""              # code région France Travail — optionnel
  distance_km: 0          # rayon autour du département/commune — optionnel
  max_pages: 2            # pages de 150 offres par requête
  include_alternance: true

# ── Adzuna (agrégateur d'offres, API France — gratuite et ouverte à tous) ───
# Inscription libre sur https://developer.adzuna.com puis mets dans
# ~/.applypilot/.env : ADZUNA_APP_ID / ADZUNA_APP_KEY.
adzuna:
  country: fr
  queries:
    - "stage cybersécurité"
    - "stage administrateur systèmes et réseaux"
    - "stage intégration IT"
    - "stage Active Directory"
  where: ""               # ville / département, optionnel
  max_days_old: 30
  max_pages: 3            # pages de results_per_page offres par requête
  results_per_page: 50
  include_alternance: true
