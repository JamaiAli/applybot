<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ApplyPilot Autofill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      width: 320px;
      background: #0f172a;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background: #1e293b;
      color: #94a3b8;
    }
    .badge.connected {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }
    .badge.disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .candidate-name {
      font-weight: 600;
      font-size: 14px;
      color: #ffffff;
    }
    .candidate-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      transition: all 0.15s ease;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #475569;
      color: #ffffff;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ ApplyPilot</div>
    <div id="status-badge" class="badge">Vérification...</div>
  </div>

  <div class="card">
    <div class="candidate-name" id="cand-name">Ali Jamai</div>
    <div class="candidate-sub" id="cand-email">ali.jamai@insa-cvl.fr</div>
    <div class="candidate-sub" id="cand-cv">📄 CV : prêt</div>
  </div>

  <button class="btn btn-primary" id="btn-autofill">
    <span>📝</span> Remplir le formulaire actuel
  </button>

  <button class="btn btn-secondary" id="btn-download-cv">
    <span>📄</span> Télécharger mon CV adapté
  </button>

  <div class="footer">
    ApplyPilot local • port 8765
  </div>

  <script src="popup.js"></script>
</body>
</html>
